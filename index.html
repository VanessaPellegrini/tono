<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>last-guitar</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <video id="webcam" playsinline muted></video>

    <header id="topbar">
      <button id="btn-joystick" class="mode-btn" type="button">Joystick</button>
      <button id="btn-dualwheel" class="mode-btn active" type="button">Dual Wheel</button>
      <button id="btn-webcam" class="mode-btn" type="button">Webcam</button>
    </header>

    <footer id="instrument-bar">
      <div id="scale-control" class="control-group">
        <button id="btn-scale-prev" class="ctrl-btn" type="button" title="Previous scale">&#9664;</button>
        <span id="scale-label" class="ctrl-label">C Major</span>
        <button id="btn-scale-next" class="ctrl-btn" type="button" title="Next scale">&#9654;</button>
      </div>
      <div class="divider"></div>
      <button id="btn-guitar" class="instrument-btn" type="button">Guitarra</button>
      <button id="btn-piano" class="instrument-btn active" type="button">Piano</button>
    </footer>

    <div id="start-overlay">
      <div id="start-content">
        <p>Tap anywhere or press any key to start</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
