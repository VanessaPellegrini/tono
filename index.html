<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>last-guitar</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <video id="webcam" playsinline muted></video>

    <header id="topbar">
      <button id="btn-joystick" class="mode-btn active" type="button">Joystick</button>
      <button id="btn-webcam" class="mode-btn" type="button">Webcam</button>
    </header>

    <footer id="instrument-bar">
      <button id="btn-guitar" class="instrument-btn active" type="button">Guitarra</button>
      <button id="btn-piano" class="instrument-btn" type="button">Piano</button>
      <div id="detune-control">
        <button id="btn-detune-down" class="detune-btn" type="button">-5</button>
        <span id="detune-value">0 ct</span>
        <button id="btn-detune-up" class="detune-btn" type="button">+5</button>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
