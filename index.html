<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>last-guitar</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <video id="webcam" playsinline style="display:none"></video>

    <div id="overlay">
      <h1>last-guitar</h1>
      <p>Play guitar with your hands or controller</p>
      <button id="start-btn">Start</button>
    </div>

    <div id="ui" style="display:none">
      <div id="controls">
        <div id="mode-toggle">
          <button id="btn-free" class="active">Free</button>
          <button id="btn-story">Story</button>
        </div>
        <div id="song-select" style="display:none">
          <button data-song="throughTheValley">Through the Valley</button>
          <button data-song="futureDays">Future Days</button>
          <button id="btn-play-song">Play</button>
          <button id="btn-stop-song">Stop</button>
        </div>
        <div id="input-toggle">
          <button id="btn-camera">Enable Camera</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
